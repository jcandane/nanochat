# .github/workflows/simulation.yml
name: Run or recover operator-square simulation

# ---------------------------------------------------------------------------
# Graft DAG (all arms share one parameter vector; every graft is a pure
# operator swap on identical weights):
#
#     attention (untouched d32)  ──►  amap
#     attention (untouched d32)  ──►  hmap
#     amap  (adapted checkpoint) ──►  dmap
#
# attention → attention is the fine-tune / drift control.
# The DAG is enforced in "Validate inputs" below.
#
# Token budget: the scientific batch is nanochat's 524,288 tokens per
# optimizer step (LR scale = 1, Karpathy's schedule verbatim). With
# horizon=3000 that is ~1.57B tokens per arm — the budget of the original
# AMAP-3000 result. Do NOT lower total_batch_size to fit a small GPU: the
# base_train LR scaling (sqrt(B/B_ref)) will silently starve the run.
# Lower device_batch_size instead (gradient accumulation compensates).
#
# Eager path memory (d32: 16 heads, T=2048, 32 layers): device_batch_size=4
# is the expected ceiling on an 80GB H100; smoke-test 10 steps first and
# fall back to 2 if it OOMs.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "train = new continuous trajectory; recover = resume/publish a pending one"
        required: true
        default: "train"
        type: choice
        options:
          - train
          - recover

      source_checkpoint:
        description: >-
          Source weights (HF path). attention/amap/hmap arms graft from the
          untouched source attention/run-0001/checkpoints/step-000000;
          the dmap arm grafts from an adapted AMAP checkpoint, e.g.
          AMAP/run-0003/checkpoints/step-003000.
        required: true
        default: "attention/run-0001/checkpoints/step-000000"
        type: string

      arm:
        description: "Operator used for the entire trajectory"
        required: true
        default: "amap"
        type: choice
        options:
          - attention
          - amap
          - hmap
          - dmap

      horizon:
        description: "Fixed optimizer/LR-schedule horizon (steps at total_batch_size tokens each)"
        required: true
        default: "3000"
        type: string

      milestone_every:
        description: "Pause for BPB + CORE + induction/DAC every N optimizer steps"
        required: true
        default: "250"
        type: string

      pending_job:
        description: "Recover mode: latest or a simulation job-id substring"
        required: true
        default: "latest"
        type: string

      gpu:
        description: "Modal GPU type"
        required: true
        default: "H100"
        type: choice
        options:
          - H100
          - H200
          - B200
          - A100-80GB

      num_gpus:
        description: "GPUs in the simulation container"
        required: true
        default: "8"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      device_batch_size:
        description: "Per-device sequence batch (eager attention: 4 on H100-80GB; use 2 if OOM)"
        required: true
        default: "4"
        type: string

      total_batch_size:
        description: "Scientific optimizer batch in tokens (nanochat reference: 524288)"
        required: true
        default: "524288"
        type: string

      learning_rate_multiplier:
        description: "Global multiplier on nanochat LR groups (1.0 = defaults; matrix LR 0.02 before batch scaling)"
        required: true
        default: "1.0"
        type: string

      data_shards:
        description: "nanochat pretraining shards"
        required: true
        default: "240"
        type: string

      eval_tokens:
        description: "Validation BPB token budget at each milestone"
        required: true
        default: "4194304"
        type: string

      core_max_per_task:
        description: "CORE examples per task at each milestone"
        required: true
        default: "500"
        type: string

      induction_lengths:
        description: "Repeated-random half-lengths"
        required: true
        default: "32,64,128,256,512"
        type: string

      induction_offsets:
        description: "DAC induction-edge offsets"
        required: true
        default: "-2,-1,0,1,2"
        type: string

      induction_num_batches:
        description: "Logical induction batches per length"
        required: true
        default: "4"
        type: string

      induction_seed:
        description: "Fixed induction benchmark seed"
        required: true
        default: "1234"
        type: string

      revision:
        description: "HF_REPO branch/revision"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

# A pending job reserves its run id on the Modal volume. Serialize simulations
# within one arm while allowing different arms to run independently if desired.
concurrency:
  group: operator-square-simulation-${{ inputs.arm }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_REPO: ${{ secrets.HF_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required repository secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_REPO HF_TOKEN MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret '$name' is not configured."
              exit 1
            fi
          done

      - name: Validate inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ARM: ${{ inputs.arm }}
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
          HORIZON: ${{ inputs.horizon }}
          MILESTONE_EVERY: ${{ inputs.milestone_every }}
          NUM_GPUS: ${{ inputs.num_gpus }}
          DEVICE_BATCH_SIZE: ${{ inputs.device_batch_size }}
          TOTAL_BATCH_SIZE: ${{ inputs.total_batch_size }}
          LEARNING_RATE_MULTIPLIER: ${{ inputs.learning_rate_multiplier }}
          DATA_SHARDS: ${{ inputs.data_shards }}
          EVAL_TOKENS: ${{ inputs.eval_tokens }}
          CORE_MAX_PER_TASK: ${{ inputs.core_max_per_task }}
          INDUCTION_NUM_BATCHES: ${{ inputs.induction_num_batches }}
          INDUCTION_SEED: ${{ inputs.induction_seed }}
        run: |
          set -euo pipefail
          for pair in \
            "horizon:$HORIZON" \
            "milestone_every:$MILESTONE_EVERY" \
            "device_batch_size:$DEVICE_BATCH_SIZE" \
            "total_batch_size:$TOTAL_BATCH_SIZE" \
            "data_shards:$DATA_SHARDS" \
            "eval_tokens:$EVAL_TOKENS" \
            "core_max_per_task:$CORE_MAX_PER_TASK" \
            "induction_num_batches:$INDUCTION_NUM_BATCHES"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            [[ "$value" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::$name must be a positive integer"; exit 1;
            }
          done
          [[ "$NUM_GPUS" =~ ^(1|2|4|8)$ ]] || {
            echo "::error::num_gpus must be 1, 2, 4, or 8"; exit 1;
          }
          (( HORIZON % MILESTONE_EVERY == 0 )) || {
            echo "::error::milestone_every must divide horizon exactly"; exit 1;
          }
          [[ "$INDUCTION_SEED" =~ ^-?[0-9]+$ ]] || {
            echo "::error::induction_seed must be an integer"; exit 1;
          }

          python - "$LEARNING_RATE_MULTIPLIER" <<'PY'
          import math
          import sys
          value = float(sys.argv[1])
          if not math.isfinite(value) or value <= 0:
              raise SystemExit("learning_rate_multiplier must be finite and > 0")
          print(
              "::notice::LR multiplier="
              f"{value:g}; pre-batch-scale LRs: "
              f"embedding={0.3*value:g}, "
              f"unembedding={0.008*value:g}, "
              f"matrix={0.02*value:g}, "
              f"scalar={0.5*value:g}"
          )
          PY

          # --- Token-budget guard -------------------------------------------
          # total_batch_size must be a multiple of num_gpus*device_batch_size*2048
          # (gradient accumulation), and we refuse starved recipes.
          seq_len=2048
          micro=$(( NUM_GPUS * DEVICE_BATCH_SIZE * seq_len ))
          (( TOTAL_BATCH_SIZE % micro == 0 )) || {
            echo "::error::total_batch_size ($TOTAL_BATCH_SIZE) must be a multiple of num_gpus*device_batch_size*2048 = $micro"; exit 1;
          }
          if (( TOTAL_BATCH_SIZE < 262144 )); then
            echo "::error::total_batch_size=$TOTAL_BATCH_SIZE is below 262144 tokens; the base_train LR scaling sqrt(B/B_ref) will starve the run. Use 524288 (nanochat reference)."; exit 1
          fi
          tokens=$(( TOTAL_BATCH_SIZE * HORIZON ))
          echo "::notice::Token budget for this arm: $tokens tokens ($HORIZON steps x $TOTAL_BATCH_SIZE)"

          # --- Graft DAG guard (train mode only) -----------------------------
          # attention / amap / hmap graft from the untouched source;
          # dmap grafts from an adapted AMAP checkpoint.
          if [[ "$MODE" == "train" ]]; then
            case "$ARM" in
              attention|amap|hmap)
                [[ "$SOURCE_CHECKPOINT" == attention/* ]] || {
                  echo "::error::arm=$ARM must graft from an attention/* source (untouched d32); got '$SOURCE_CHECKPOINT'"; exit 1;
                }
                ;;
              dmap)
                [[ "$SOURCE_CHECKPOINT" == AMAP/* || "$SOURCE_CHECKPOINT" == amap/* ]] || {
                  echo "::error::arm=dmap must graft from an adapted AMAP checkpoint (AMAP/run-XXXX/checkpoints/step-NNNNNN); got '$SOURCE_CHECKPOINT'"; exit 1;
                }
                [[ "$SOURCE_CHECKPOINT" != */step-000000 ]] || {
                  echo "::error::arm=dmap source must be an ADAPTED AMAP checkpoint, not step-000000"; exit 1;
                }
                ;;
            esac
            echo "::notice::Graft: $SOURCE_CHECKPOINT --> arm=$ARM"
          fi

      - name: Install Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal huggingface_hub

      - name: Run or recover simulation on Modal
        shell: bash
        run: |
          set -euo pipefail

          modal run modal/simulation.py \
            --hf-repo "$HF_REPO" \
            --mode "${{ inputs.mode }}" \
            --source-checkpoint "${{ inputs.source_checkpoint }}" \
            --arm "${{ inputs.arm }}" \
            --horizon "${{ inputs.horizon }}" \
            --milestone-every "${{ inputs.milestone_every }}" \
            --pending-job "${{ inputs.pending_job }}" \
            --gpu "${{ inputs.gpu }}" \
            --num-gpus "${{ inputs.num_gpus }}" \
            --device-batch-size "${{ inputs.device_batch_size }}" \
            --total-batch-size "${{ inputs.total_batch_size }}" \
            --learning-rate-multiplier "${{ inputs.learning_rate_multiplier }}" \
            --data-shards "${{ inputs.data_shards }}" \
            --eval-tokens "${{ inputs.eval_tokens }}" \
            --core-max-per-task "${{ inputs.core_max_per_task }}" \
            --induction-lengths "${{ inputs.induction_lengths }}" \
            --induction-offsets="${{ inputs.induction_offsets }}" \
            --induction-num-batches "${{ inputs.induction_num_batches }}" \
            --induction-seed "${{ inputs.induction_seed }}" \
            --revision "${{ inputs.revision }}"
