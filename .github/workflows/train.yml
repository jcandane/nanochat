# .github/workflows/train.yml
name: Train or recover operator-square run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "train = new run; recover = publish a completed pending Modal job"
        required: true
        default: "train"
        type: choice
        options:
          - train
          - recover

      source_checkpoint:
        description: "Train mode: canonical source checkpoint"
        required: false
        default: "attention/run-0001/checkpoints/step-000000"
        type: string

      target_arm:
        description: "Train mode: operator used for the NEW run"
        required: true
        default: "amap"
        type: choice
        options:
          - attention
          - amap
          - hmap
          - dmap

      steps:
        description: "Train mode: fresh local optimizer steps"
        required: true
        default: "20"
        type: string

      pending_job:
        description: "Recover mode: 'latest' or a pending job id/sub-string"
        required: true
        default: "latest"
        type: string

      gpu:
        description: "Train mode: Modal GPU type"
        required: true
        default: "H100"
        type: choice
        options:
          - H100
          - H200
          - B200
          - A100-80GB

      num_gpus:
        description: "Train mode: GPUs in one Modal container"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      device_batch_size:
        description: "Train mode: per-device sequence batch"
        required: true
        default: "1"
        type: string

      total_batch_size:
        description: "Train mode: total batch in tokens; 2048 = one d32 sequence on 1 GPU"
        required: true
        default: "2048"
        type: string

      data_shards:
        description: "Train mode: nanochat pretraining shards"
        required: true
        default: "240"
        type: string

      revision:
        description: "HF_REPO branch/revision"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

# Serialize run allocation and recovery. Pending jobs reserve their run id in the
# Modal volume, but a single queue is the simplest additional collision guard.
concurrency:
  group: operator-square-train-publish
  cancel-in-progress: false

jobs:
  train-or-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_REPO: ${{ secrets.HF_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required repository secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in HF_REPO HF_TOKEN MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret '$name' is not configured."
              exit 1
            fi
          done

      - name: Validate train-mode inputs
        if: ${{ inputs.mode == 'train' }}
        shell: bash
        env:
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
          STEPS: ${{ inputs.steps }}
          NUM_GPUS: ${{ inputs.num_gpus }}
          DEVICE_BATCH_SIZE: ${{ inputs.device_batch_size }}
          TOTAL_BATCH_SIZE: ${{ inputs.total_batch_size }}
          DATA_SHARDS: ${{ inputs.data_shards }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_CHECKPOINT" ]] || {
            echo "::error::source_checkpoint is required in train mode"; exit 1;
          }
          [[ "$STEPS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::steps must be a positive integer"; exit 1;
          }
          [[ "$NUM_GPUS" =~ ^(1|2|4|8)$ ]] || {
            echo "::error::num_gpus must be 1, 2, 4, or 8"; exit 1;
          }
          [[ "$DEVICE_BATCH_SIZE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::device_batch_size must be positive"; exit 1;
          }
          [[ "$DATA_SHARDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::data_shards must be positive"; exit 1;
          }
          [[ "$TOTAL_BATCH_SIZE" == "-1" || "$TOTAL_BATCH_SIZE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::total_batch_size must be -1 or a positive integer"; exit 1;
          }

      - name: Install Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal huggingface_hub

      - name: Train or recover on Modal
        shell: bash
        run: |
          set -euo pipefail

          modal run modal/train.py \
            --hf-repo "$HF_REPO" \
            --mode "${{ inputs.mode }}" \
            --source-checkpoint "${{ inputs.source_checkpoint }}" \
            --target-arm "${{ inputs.target_arm }}" \
            --steps "${{ inputs.steps }}" \
            --pending-job "${{ inputs.pending_job }}" \
            --gpu "${{ inputs.gpu }}" \
            --num-gpus "${{ inputs.num_gpus }}" \
            --device-batch-size "${{ inputs.device_batch_size }}" \
            --total-batch-size "${{ inputs.total_batch_size }}" \
            --data-shards "${{ inputs.data_shards }}" \
            --revision "${{ inputs.revision }}"
